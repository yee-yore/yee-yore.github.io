<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="680" height="420" fill="#f1f3f4"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="680" height="44" fill="#dfe1e5"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="46" cy="22" r="6" fill="#febc2e"/><circle cx="68" cy="22" r="6" fill="#28c840"/>
  <rect x="96" y="12" width="560" height="22" rx="11" fill="#ffffff"/>
  <text x="112" y="28" font-size="13" fill="#5f6368">https://verify-human-check[.]top</text>
  <!-- card -->
  <rect x="150" y="96" width="380" height="118" rx="6" fill="#ffffff" stroke="#d3d3d3"/>
  <rect x="172" y="132" width="26" height="26" rx="3" fill="#ffffff" stroke="#c1c1c1" stroke-width="2"/>
  <path d="M176 146 l5 5 l9 -11" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="214" y="150" font-size="16" fill="#202124">I'm not a robot</text>
  <g transform="translate(470,120)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#eef1f8"/>
    <circle cx="20" cy="18" r="10" fill="none" stroke="#9aa0a6" stroke-width="3"/>
    <text x="20" y="54" font-size="9" fill="#9aa0a6" text-anchor="middle">verify</text>
  </g>
  <!-- instruction panel -->
