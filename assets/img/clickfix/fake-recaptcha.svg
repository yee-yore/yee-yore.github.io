    <text x="170" y="320">2.  Press  Ctrl + V</text>
    <text x="170" y="348">3.  Press  Enter</text>
  </g>
  <text x="170" y="374" font-size="11" fill="#9a7b00" font-style="italic">to confirm you are human</text>
  <text x="18" y="412" font-size="11" fill="#9aa0a6">example mock-up — generic re-creation, not a real brand page</text>
