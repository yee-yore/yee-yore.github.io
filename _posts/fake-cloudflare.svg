<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="680" height="420" fill="#ffffff"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="680" height="44" fill="#dfe1e5"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="46" cy="22" r="6" fill="#febc2e"/><circle cx="68" cy="22" r="6" fill="#28c840"/>
  <rect x="96" y="12" width="560" height="22" rx="11" fill="#ffffff"/>
  <text x="112" y="28" font-size="13" fill="#5f6368">https://cdn-check-access[.]cc</text>
  <!-- heading -->
  <text x="60" y="104" font-size="20" font-weight="bold" fill="#1d1d1f">Checking your browser before you continue</text>
  <text x="60" y="130" font-size="13" fill="#6e6e73">example-site.com needs to review the security of your connection.</text>
  <!-- verify box -->
  <rect x="60" y="156" width="330" height="60" rx="6" fill="#f6f7f9" stroke="#e3e5e8"/>
  <circle cx="92" cy="186" r="11" fill="none" stroke="#f6821f" stroke-width="3" stroke-dasharray="40 18">
    <animateTransform attributeName="transform" type="rotate" from="0 92 186" to="360 92 186" dur="1s" repeatCount="indefinite"/>
  </circle>
  <text x="118" y="191" font-size="14" fill="#1d1d1f">Verifying you are human. This may take a few seconds.</text>
  <!-- instruction panel -->
  <rect x="60" y="244" width="560" height="140" rx="6" fill="#f0f4ff" stroke="#c6d4f5"/>
  <text x="80" y="272" font-size="14" font-weight="bold" fill="#1a3a7a">Verification required — complete the steps</text>
  <g font-size="14" fill="#2c2c2c">
    <text x="80" y="306"> Step 1   Press  Win + R</text>
    <text x="80" y="334"> Step 2   Press  Ctrl + V</text>
    <text x="80" y="362"> Step 3   Press  Enter</text>
  </g>
  <rect x="430" y="286" width="170" height="80" rx="4" fill="#ffffff" stroke="#c6d4f5"/>
  <text x="515" y="312" font-size="11" fill="#6e6e73" text-anchor="middle">Ray ID</text>
  <text x="515" y="334" font-size="13" fill="#1d1d1f" text-anchor="middle" font-family="monospace">9802b213d92d</text>
  <text x="18" y="412" font-size="11" fill="#9aa0a6">example mock-up — generic re-creation, not a real brand page</text>
</svg>
