<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="680" height="420" fill="#0078d7"/>
  <text x="60" y="110" font-size="96" fill="#ffffff" font-family="Segoe UI, Arial">:(</text>
  <text x="60" y="170" font-size="22" fill="#ffffff">Your PC ran into a problem and needs a quick fix.</text>
  <text x="60" y="202" font-size="15" fill="#dbeeff">Error code: CRITICAL_PROCESS_VERIFY (0x000000EF)</text>
  <!-- fake fix box -->
  <rect x="60" y="232" width="560" height="150" rx="4" fill="#1565b0" stroke="#4a97e0"/>
  <text x="80" y="262" font-size="15" font-weight="bold" fill="#ffffff">To repair automatically, complete the verification:</text>
  <g font-size="15" fill="#eaf4ff">
    <text x="80" y="298">1.   Press   Win + R</text>
    <text x="80" y="328">2.   Press   Ctrl + V</text>
    <text x="80" y="358">3.   Press   Enter   to apply the fix</text>
  </g>
  <rect x="420" y="276" width="190" height="86" rx="4" fill="#0e4f8c"/>
  <text x="515" y="306" font-size="11" fill="#9fc6ea" text-anchor="middle">Recovery token</text>
  <text x="515" y="330" font-size="13" fill="#ffffff" text-anchor="middle" font-family="monospace">FIX-9802B213</text>
  <text x="18" y="412" font-size="11" fill="#bcdcff">example mock-up — generic re-creation, not a real Windows screen</text>
</svg>
